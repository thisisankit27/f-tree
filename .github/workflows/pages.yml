name: Site

# The landing page at site/ is a plain static site with no build step. It deploys from
# the Actions artifact rather than a branch so it can live in site/ without colliding
# with docs/, and so main stays the only branch in the repository.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the pages are intact
        run: |
          set -euo pipefail
          for f in site/index.html site/thanks/index.html site/style.css site/app.js; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          # Every local asset referenced by the HTML must actually exist, so a renamed
          # screenshot fails here rather than showing up as a broken image in public.
          missing=0
          while read -r page ref; do
            case "$ref" in http*|mailto:*|\#*|data:*) continue ;; esac
            target="$(dirname "$page")/${ref%%[?#]*}"
            [ -e "$target" ] || { echo "broken reference in $page -> $ref"; missing=1; }
          done < <(grep -oE '(src|href)="[^"]+"' -r site --include='*.html' \
                   | sed -E 's/:(src|href)="/ /; s/"$//')
          test "$missing" -eq 0

      # Every colour the pages ask for is defined, with no fallback to hide it when it is not, and
      # the two copies of the night palette agree. Four tokens were missing until 0.6.0 shipped.
      - name: The stylesheet's colours exist in both themes
        run: node --test site/style-tokens.test.mjs

      # The engine's own suites, which are the rules ported out of the Kotlin rather than anything
      # about the page: who belongs on a chart centred on one person, and how a generation is read
      # across. They run here as well as in the desktop workflow because the engine ships to both
      # shells, and the site is the one that deploys without a desktop build in the way.
      - name: The engine's rules, ported out of the Kotlin
        run: node --test "site/playground/*.test.mjs"

      # The policy switch (#156) is the same story: `site/book/policy.js` is ported to Kotlin as
      # `entitlement/Entitlements.kt`, sharing `policy-cases.json` with it, and this is the one
      # workflow that runs the JavaScript side without also needing a desktop or Android build.
      - name: The family book's composer and policy rules
        run: node --test "site/book/*.test.mjs"

      # Pillow, because `make_sample_tree.py` now refuses to run without it. It used to carry on and
      # write a fixture with no photographs in it, which no runner has ever had the library to draw --
      # so every check that reads the sample tree has, until now, been reading a tree with none. A
      # photograph is the hardest thing in the format to round-trip and the one CI never saw.
      - name: Pillow, for the photographs in the sample tree
        run: python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow

      - name: Check the viewer parses and lays out a real archive
        run: |
          set -euo pipefail
          # Builds .ftree fixtures from the same schema the app writes, including one streamed
          # through an unseekable zip - which zeroes the local file headers exactly as
          # java.util.zip.ZipOutputStream does - then asserts the layout invariants: everybody
          # placed once, nobody overlapping on their row, children below their parents, and the
          # unconnected people that are the whole point of the page actually on the canvas.
          python3 tools/make_sample_tree.py "$RUNNER_TEMP/fixtures"
          node tools/check_layout.mjs "$RUNNER_TEMP/fixtures"

      # The book's composer measures text by reading these tables, not by asking a layout engine
      # for a size - see tools/font_metrics.mjs. A font swap that lands without regenerating them
      # would ship a metrics table describing a font that is no longer there, so this fails the
      # build instead of drifting silently. site/book/metrics is what this workflow deploys, so the
      # check belongs here as much as in the desktop workflow.
      - name: Check the book fonts' metrics tables are current
        run: node tools/font_metrics.mjs --check

      # The storybook's paper-cut art is compiled from authored SVG (site/book/art/src/papercut) into
      # committed modules (site/book/art/papercut) - see tools/book_art.mjs. This fails when a source
      # changed without recompiling, and when swatches.json's tokens drift from template.js's
      # paper-cut palette, which would paint a colour no template can supply.
      - name: Check the book's compiled art is current
        run: node tools/book_art.mjs --check

      # The writer is the first piece of the editor, and the only reader that matters for it is the
      # Android app's: it walks local file headers, so an archive whose sizes live in a data
      # descriptor reads as empty there. Checked against a real export, both directions.
      - name: Check the .ftree writer
        run: node tools/check_writer.mjs "$RUNNER_TEMP/fixtures"

      - name: Check the viewer's module graph resolves
        run: |
          set -euo pipefail
          missing=0
          while read -r file spec; do
            target="$(dirname "$file")/$spec"
            [ -f "$target" ] || { echo "broken import in $file -> $spec"; missing=1; }
          done < <(grep -rhoE "from '\./[^']+'" site/playground --include='*.js' \
                   | sed -E "s/from '\.\///; s/'$//" \
                   | while read -r s; do echo "site/playground/x $s"; done)
          test "$missing" -eq 0
          test -s site/playground/sample-family.ftree

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
