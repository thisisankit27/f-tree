name: Desktop

# The desktop app is built and smoke-tested on every change to it or to the viewer it runs, and
# packaged for Windows and Linux when a `desktop-v*` tag is pushed.
#
# The tag prefix is not decoration. The Android updater reads this repository's releases and asks
# `AppVersion.parse` to make sense of each tag; its pattern is `^v?(\d+(\.\d+)*)(-(.+))?$`, which
# `desktop-v0.1.0` cannot match, so a desktop release is invisible to both the ordinary and the
# beta channel. Publishing as a pre-release on top of that keeps `releases/latest` - the endpoint
# the ordinary channel reads - answering with the newest *app* release. Two independent reasons a
# phone will never be offered an .AppImage, because there are live users on the app.
#
# The pre-release flag now carries a second meaning as well: the desktop app stays a pre-release
# until issue #89 is finished. Until then it reads a tree and does not build one, and calling any
# build of it a stable release would claim a completeness it does not have.
#
# Worth keeping straight, because the two senses of "beta" are not the same mechanism:
#
#   GitHub's pre-release flag  ->  how finished this is. Set on every desktop release.
#   the tag's suffix           ->  the app's own beta channel. `desktop-v0.3.3` is stable to it;
#                                  `desktop-v0.3.3-beta.1` is not. See update.js.
#
# So a reader who has not opted into betas is still offered `desktop-v0.3.3`. That is deliberate:
# withholding it would strand people on a build that will not start on current Ubuntu.
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'site/playground/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  pull_request:
    paths: ['desktop/**', 'site/playground/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  smoke:
    name: Start the app and open a tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install
        working-directory: desktop
        run: npm ci || npm install

      # The update rules are pure and their table is the mitigation for porting rules out of the
      # Kotlin: a divergence fails here rather than offering somebody the wrong build.
      - name: Update rules
        working-directory: desktop
        run: npm test

      # The layout is checked in both orientations here as well as in the site workflow. Both
      # shells draw rows today, but the engine keeps columns and so does this check: an
      # orientation nobody currently ships is exactly the one that rots unnoticed.
      - name: Check the layout, rows and columns
        run: |
          python3 tools/make_sample_tree.py "$RUNNER_TEMP/fixtures"
          node tools/check_layout.mjs "$RUNNER_TEMP/fixtures"

      # The writer is the first piece of the editor, and the only reader that matters for it is the
      # Android app's: it walks local file headers, so an archive whose sizes live in a data
      # descriptor reads as empty there. Checked against a real export, both directions.
      - name: Check the .ftree writer
        run: node tools/check_writer.mjs "$RUNNER_TEMP/fixtures"

      # A desktop app cannot be checked by reading it: the shell, the preload bridge and the viewer
      # only meet once a window exists. So this starts the real app and asserts what would actually
      # be broken if the wiring came apart.
      - name: Smoke test
        working-directory: desktop
        env:
          FTREE_SMOKE: ${{ runner.temp }}/fixtures/sample-family.ftree
          # Asserts the updater is not blocked by the page's own network refusal - the regression
          # that shipped in 0.2.0 and reported itself as ERR_BLOCKED_BY_CLIENT.
          FTREE_SMOKE_NETWORK: '1'
        run: xvfb-run -a npx electron . --no-sandbox

  package:
    name: Package (${{ matrix.os }})
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux
          - os: windows-latest
            targets: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install
        working-directory: desktop
        run: npm ci || npm install

      - name: Build the installers
        working-directory: desktop
        run: npx electron-builder ${{ matrix.targets }} --publish never

      # The postinst is generated by electron-builder, so it is not reviewable in this repo and
      # not covered by any source test. It shipped 0.3.2 with a sandbox probe that is unsound on
      # Ubuntu 24.04+, and the app core-dumped before drawing a window. This opens the built .deb
      # and reads what it will actually run as root.
      - name: What the Linux package promises the OS
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop
        run: node --test package.test.js

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.tar.gz
            desktop/dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#desktop-v}"
          ls -la installers

          # Published as a pre-release deliberately. See the note at the top of this file: it is
          # what keeps `releases/latest` answering with the newest Android release for the app's
          # ordinary update channel.
          gh release create "$GITHUB_REF_NAME" installers/* \
            --prerelease \
            --title "f-tree desktop $version" \
            --notes "The desktop app for Windows and Linux, version $version.

          - **Windows**: the \`.exe\` installer.
          - **Linux**: the \`.deb\` is the one to take. It is the only Linux format that can give
            Chromium a working sandbox helper without you touching anything; the portable
            \`.tar.gz\` and the \`.AppImage\` need one \`sudo chmod 4755\` on Ubuntu 24.04+.

          Marked a pre-release on purpose, for two reasons. It keeps the Android app's update
          channel pointing at Android releases; and the desktop app stays a pre-release until
          [#89](https://github.com/thisisankit27/f-tree/issues/89) is done, because it reads a
          tree today and does not yet build one."
