<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 136 136" data-anchor="center">
<desc>The group medallion: a gold sunburst cut round a bezel, so a group portrait reads as lit rather
than garlanded. Sharp, spaced gold rays, alternating long and short - never a ring of round
marigold beads, which is the book's marriage and mourning notation (mala/mala-departed) and would
be read as one at thumbnail size. From motifs.mjs medallion({ petals }) (#240), redrawn (#257 round
2, finding 1). Original f-tree work, MIT.</desc>
