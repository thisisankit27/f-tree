<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-anchor="center">
<desc>A faceless paper-cut bust of a man, in old age (variant a: card). Built from the shared bust-* cuts; converted from motifs.mjs bust() (#240). Original f-tree work, MIT.</desc>
