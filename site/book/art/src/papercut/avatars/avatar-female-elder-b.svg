<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" data-anchor="center">
<desc>A faceless paper-cut bust of a woman, in old age (variant b: sindoor and marigold, bun hair). Built from the shared bust-* cuts; converted from motifs.mjs bust() (#240). Original f-tree work, MIT.</desc>
<rect data-zone="face" x="36.8" y="31.2" width="26.4" height="32"/>
<g data-asset="bust-ground"/>
<g data-asset="bust-bun" fill="#d9d2ca"/>
<g data-asset="bust-shoulders" transform="translate(1.2 1.6)" fill="#2a1a33" opacity="0.2"/>
<g data-asset="bust-shoulders" fill="#c23b2e"/>
<g data-asset="bust-print"/>
<g data-asset="bust-collar"/>
<g data-asset="bust-drape" transform="translate(0.9 1.3)" fill="#2a1a33" opacity="0.22"/>
<g data-asset="bust-drape" fill="#f2a71b"/>
<g data-asset="bust-drape-border"/>
<g data-asset="bust-head"/>
<g data-asset="bust-hair-parted" transform="translate(0.4 1)" fill="#2a1a33" opacity="0.25"/>
<g data-asset="bust-hair-parted" fill="#d9d2ca"/>
<g data-asset="bust-earrings"/>
<g data-asset="bust-specs"/>
</svg>
