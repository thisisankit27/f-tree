<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" data-anchor="bottom-center">
  <title>A frame with zones</title>
  <desc>Fixture for #247: zones and an opening are read and never drawn.</desc>
  <rect x="0" y="0" width="100" height="50" fill="#b5562a"/>
  <rect data-zone="text" x="10" y="5" width="30" height="10" fill="#c23b2e" opacity="0.3"/>
  <g transform="translate(50 0)"><rect data-zone="face" x="5" y="5" width="10" height="10" fill="none"/></g>
  <rect data-zone="busy" x="0" y="40" width="100" height="10" fill="none"/>
  <circle data-clip="opening" cx="50" cy="25" r="15" fill="none"/>
</svg>
